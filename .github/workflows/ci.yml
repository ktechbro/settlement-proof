name: correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: settlement
          POSTGRES_PASSWORD: settlement-test
          POSTGRES_DB: settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement -d settlement"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://settlement:settlement-test@127.0.0.1:5432/settlement?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
      - run: DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/solana-demo
      - run: DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/escrow-demo
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
