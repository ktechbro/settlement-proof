services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement-local
      POSTGRES_DB: settlement
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 2s
      timeout: 3s
      retries: 30
  indexer:
    build: .
    profiles: [live]
    env_file: .env
    environment:
      DATABASE_URL: postgres://settlement:settlement-local@postgres:5432/settlement?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  demo:
    build: .
    profiles: [demo]
    entrypoint: [/app/demo]
    environment:
      DATABASE_URL: postgres://settlement:settlement-local@postgres:5432/settlement?sslmode=disable
      DEMO_RUN_ID: ${DEMO_RUN_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
  solana-demo:
    build: .
    profiles: [solana-demo]
    entrypoint: [/app/solana-demo]
    environment:
      DATABASE_URL: postgres://settlement:settlement-local@postgres:5432/settlement?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
